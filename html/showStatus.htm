<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Overlay test</title>
  <style>
	body{
		font-family:Arial, sans-serif;
		display:flex;
		align-items:center;
		justify-content:center;
		font-size:80px;
		position:absolute;
		inset:0;
	}
	#statusOverlay{
		position:fixed;
		top:10px;
		left:50%;
		transform:translateX(-50%);
		font-size:40px;
		background:rgba(0,0,0,0.3);
		color:white;
		font-family:Arial,sans-serif;
		border-radius:10px;
		padding:10px 15px 10px 15px;
		z-index: 999;
		pointer-events:none;
		user-select:none;
		opacity:0;
		transition:opacity .1s linear;
	}
	.statusOverlay--showing{
		opacity:1 !important;
	}
    .frost-foot {
        font-family: Roboto, Arial, sans-serif;
        position:fixed;
        bottom:10px;
        right:10px;
        font-size:15px;
        text-align:right;
        width:100%;
        color:black;
        opacity:0.4;
        pointer-events:none;
		z-index:999;
    }
  </style>
</head>
<body>
<span id='statusOverlay'></span>
Press some keys!
<footer class='frost-foot'>Status Overlay 0.1.1<br>© Frostbyte 2026 // AGPL-3.0</footer>
<script type="module">
const statusOverlay = document.getElementById('statusOverlay');
let statusTimeout=null;
function showStatus(text,temp=true){
	statusOverlay.textContent = text;
	statusOverlay.classList.add('statusOverlay--showing');
	clearTimeout(statusTimeout);
	if(temp){
		statusTimeout=setTimeout(()=>statusOverlay.classList.remove('statusOverlay--showing'),2000);
	}
}
document.addEventListener('keydown',e=>showStatus(e.code))
</script>
</body>
</html>
