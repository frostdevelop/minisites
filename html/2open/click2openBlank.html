<center><h1>Click to open a HTML page</h1></center><script>const d=trustedTypes.createPolicy('d',{createHTML:i=>i});document.addEventListener('click',()=>{const e=document.createElement('input');e.type='file';e.accept='text/html';e.click();e.onchange=()=>{const f=new FileReader;f.onload=()=>{const w=window.open('about:blank');w.document.write(d.createHTML(f.result));onbeforeunload=0;history.back()};f.readAsText(e.files[0])}});window.onbeforeunload=()=>0</script>
