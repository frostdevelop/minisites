<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fsort Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--main-font: 'Stack Sans Notch',system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--bold-font: 'Momo Trust Display', sans-serif;
			--main-color: rgba(255, 255, 255, 0.95);
			--mute-color: rgba(255, 255, 255, 0.6);
			--pkt-bg: rgba(255, 255, 255, 0.025);
			--pkt-border: rgba(255, 255, 255, 0.1);
			--pkt-shadow: 
				0 20px 50px rgba(0, 0, 0, 0.4),
				inset 0 1px 0 rgba(255, 255, 255, 0.25),
				inset 0 10px 20px rgba(255, 255, 255, 0.05),
				inset 0 -15px 30px rgba(0, 0, 0, 0.25);
			--pkt-filter: blur(2px) saturate(140%);
		}

		@keyframes drift-slow {
			0% {
				transform: translate(0, 0) scale(1) rotate(0deg);
			}
			50% {
				transform: translate(8%, 12%) scale(1.1) rotate(60deg);
			}
			100% {
				transform: translate(-5%, -5%) scale(0.9) rotate(-30deg);
			}
		}

		@keyframes drift-medium {
			0% {
				transform: translate(0, 0) scale(1.05) rotate(0deg);
			}
			50% {
				transform: translate(-10%, 8%) scale(0.9) rotate(-90deg);
			}
			100% {
				transform: translate(12%, -10%) scale(1.15) rotate(45deg);
			}
		}

		html {
			font-family: var(--main-font);
			background-color: black;
			color: var(--main-color);
			overflow: hidden;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			text-rendering: optimizeSpeed;
			color-scheme:dark;
		}

		html::before {
			content: "";
			position: absolute;
			top: -20%;
			right: -10%;
			width: 60vw;
			height: 60vw;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(234, 0, 255, 0.6) 0%, rgba(138, 43, 226, 0) 100%);
			filter: blur(80px);
			z-index: -2;
			animation: drift-slow 15s infinite alternate ease-in-out;
		}

		html::after {
			content: "";
			position: absolute;
			bottom: -15%;
			left: -10%;
			width: 55vw;
			height: 55vw;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(0, 206, 209, 0.6) 0%, rgba(0, 206, 209, 0) 100%);
			filter: blur(80px);
			z-index: -1;
			animation: drift-medium 25s infinite alternate ease-in-out;
		}

		body {
			width: 100%;
			height: 100vh;
			display: flex;
			overflow:hidden;	
			padding:100px;
	    background-size: 24px 24px;
			background-image: radial-gradient(circle, rgba(255, 255, 255, 0.13) 1px, transparent 1px);
		}

		body::before {
			content: "";
			position: absolute;
			bottom: 20%;
			right: 15%;
			width: 40vw;
			height: 40vw;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(255, 76, 172, 0.6) 0%, rgba(255, 20, 147, 0) 100%);
			filter: blur(80px);
			z-index: -2;
			animation: drift-medium 20s infinite alternate ease-in-out;
		}

		body::after {
			content: "";
			position: absolute;
			top: 5%;
			left: 10%;
			width: 45vw;
			height: 45vw;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(30, 144, 255, 0.6) 0%, rgba(30, 144, 255, 0) 100%);
			filter: blur(80px);
			z-index: -2;
			animation: drift-slow 30s infinite alternate ease-in-out;
		}

		main {
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			gap:50px;
		}

		header {
			font-family: var(--main-font);
			font-weight:900;
			font-size:18vmin;
			position:absolute;
			top:50%;
			left:50%;
			transform:translate(-50%,-50%);
		  color: rgba(255,255,255,0.1);
			user-select:none;
			mix-blend-mode: overlay;
		}

		form.terry-form {
			background: var(--pkt-bg);
			border: 1px solid var(--pkt-border);
			backdrop-filter: var(--pkt-filter);
			-webkit-backdrop-filter: var(--pkt-filter);
			box-shadow: var(--pkt-shadow);
			border-radius: 8px;
			padding: 48px;
			width: 100%;
			height:100%;
			max-width: 550px;
			display: flex;
			flex-direction: column;
			gap: 28px;
			transition: box-shadow 0.5s ease, border-color 0.5s ease;
			overflow:auto;
			position:absolute;
			transition: all .5s ease;
		}

		form.terry-form:hover, #terry-display:hover{
			border-color: rgba(255, 255, 255, 0.18);
			box-shadow: 
				0 25px 60px rgba(0, 0, 0, 0.45),
				inset 0 1px 0 rgba(255, 255, 255, 0.35),
				inset 0 12px 24px rgba(255, 255, 255, 0.08),
				inset 0 -15px 30px rgba(0, 0, 0, 0.25);
		}
		
		form.terry-form.hidden {
			opacity:0;
			filter:blur(20px);
			transform:perspective(700px) rotateY(50deg) scale(0.8);
			pointer-events:none;
		}

		.terry-tab_container {
			position:relative;
			height:100%;
		}
    
		h1 {
			font-family: var(--bold-font);
			font-size: 2.2rem;
			font-weight: 900;
			letter-spacing: -0.05em;
			background: linear-gradient(135deg, #ffffff 30%, rgba(255, 255, 255, 0.7) 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: -15px;
			/*
			text-transform:uppercase;
			*/
		}

		p {
			font-size: 0.95rem;
			line-height: 1.6;
			color: var(--mute-color);
		}

		label {
			font-size: 0.8rem;
			font-weight: 700;
			letter-spacing: 0.12em;
			color: rgba(255, 255, 255, 0.85);
			margin-bottom: -16px;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		input[type="text"],
		input[type="number"],
		input[type="email"],
		input[type="password"],
		select,
		textarea {
			width: 100%;
			background: var(--pkt-bg);
			border: 1px solid var(--pkt-border);
			border-radius: 14px;
			padding: 16px 20px;
			font-size: 1rem;
			color: var(--main-color);
			font-family: var(--main-font);
			outline: none;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2), inset 0 -4px 10px rgba(0, 0, 0, 0.1);
		}

		input:focus,
		select:focus,
		textarea:focus {
			background: rgba(255, 255, 255, 0.08);
			border-color: rgba(255, 255, 255, 0.4);
			box-shadow: 
				0 0 20px rgba(255, 255, 255, 0.05),
				inset 0 1px 2px rgba(255, 255, 255, 0.05);
		}
    
		::placeholder {
			color: rgba(255, 255, 255, 0.3);
			font-size: 0.95rem;
		}

		button {
			cursor: pointer;
			font-family: var(--main-font);
			font-weight: 700;
			font-size: 1rem;
			letter-spacing: 0.02em;
			color:white;
			background:radial-gradient(circle,transparent 0%, rgba(255, 255, 255, 0.1) 100%);
			border: 1px solid #ffffff;
			border-radius: 14px;
			padding: 18px;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			text-shadow: 0 0px 5px rgba(255, 255, 255, 0.5);
			box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15), inset 0 0px 10px rgba(255, 255, 255, 0.3);
		}

		button:hover {
			color: #ffffff;
			box-shadow: 
				0 15px 30px rgba(255, 255, 255, 0.1),
				inset 0 0 8px rgba(255, 255, 255, 0.5);
			transform: translateY(-2px);
		}

		button:active {
			transform: translateY(1px);
			box-shadow: 0 5px 15px rgba(255, 255, 255, 0.05);
		}

		img,
		video {
			width: 100%;
			height: auto;
			border-radius: 18px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			background: rgba(0, 0, 0, 0.2);
			box-shadow: 
				0 10px 30px rgba(0, 0, 0, 0.3),
				inset 0 1px 2px rgba(255, 255, 255, 0.1);
			object-fit: cover;
		}

		video {
			aspect-ratio: 16 / 9;
		}

		audio {
			width: 100%;
			border-radius: 50px;
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid var(--pkt-border);
			padding: 4px;
			outline: none;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
		}
		
		.terry-section {
			border-radius: 8px;
			background: var(--pkt-bg);
			border: 1px solid var(--pkt-border);
			backdrop-filter: var(--pkt-filter);
			-webkit-backdrop-filter: var(--pkt-filter);
			box-shadow: var(--pkt-shadow);
			padding: 40px;
			height:100%;
			width:100%;
			display: flex;
			flex-direction: column;
			gap: 28px;
			transition: box-shadow 0.5s ease, border-color 0.5s ease;
			overflow-y:auto;
			overflow-x:hidden;
		}
    
		#terry-area {
			outline: none;
			height:100%;
			width:100%;
			font-size:12px;
		}

		.terry-radio {
			display:flex;
			flex-direction:row;
			gap:20px;
		}

		.terry-radio input{
			opacity:0;
			appearance:none;
		}

		.terry-radio label span{
			transition: all .1s ease;
			background: var(--pkt-bg);
			border: 1px solid var(--pkt-border);
			backdrop-filter: var(--pkt-filter);
			-webkit-backdrop-filter: var(--pkt-filter);
			box-shadow: var(--pkt-shadow);
			padding:10px;
			border-radius:15px 15px 10px 10px;
			cursor:pointer;
			transform: perspective(200px) rotateX(-45deg);
			opacity:0.75;
		}

		.terry-radio label input:checked + span {
			transform:translateY(-5px);
			opacity:1;
			filter:unset;
		}
		#main-section {
			max-width:600px;
		}
		.terry-tab {
			display:contents;
		}
	</style>
</head>
<body>
	<header>&lt;fsort&gt;</header>
	<main>
		<section class="terry-section" id="main-section">
			<h1>Fsort Demo</h1>
			<p>Test the fsort library!</p>
			<div class="terry-tab">
				<form class="terry-radio terry-tab_form">
					<label>
						<input type='radio' name='tab' value='0' checked/>
						<span>Test</span>
					</label>
				</form>
				<div class="terry-tab_container">
					<form class="terry-form">
						<h1>Test</h1>
						<button type="submit">Run</button>
						<label>
							Sort Array
							<input type="text" placeholder="e.g. 1,2,3,4" name="array" required/>
						</label>
						<label>
							Value Array (Rearranged by sort)
							<input type="text" placeholder="e.g. a,b,c,d" name="carray"/>
						</label>
					</form>
				</div>
			</div>
		</section>
		<section class="terry-section" id="terry-display">
			<!--
			<textarea id="terry-area"></textarea>
			-->
		</section>
	</main>
	<script>
		class fsort{
			static errorsuppress = false;
			static quickSort(arr,carr=null){
				carr || (carr = [...arr.keys()]);
				if(arr.length > 3){
					const oesval = fsort.errorsuppress;
					const harr = Math.trunc(arr.length/2);
					const earr = arr.length-1;
					const pivsort = fsort.tsort([arr[0],arr[harr],arr[earr]],[carr[0],carr[harr],carr[earr]]);
					arr[0] = pivsort[0][0];
					arr[earr] = pivsort[0][2];
					arr.splice(harr,1);
					arr.push(pivsort[0][1]);
					carr[0] = pivsort[1][0];
					carr[earr] = pivsort[1][2];
					carr.splice(harr,1);
					carr.push(pivsort[1][1]);
					let temp;
					let si = -1;
					for(let i=0;i<arr.length;i++){
						if(arr[i]<=arr[earr]){
							++si;
							if(i>si){
								temp = carr[i];
								carr[i] = carr[si];
								carr[si] = temp;
								temp = arr[i]
								arr[i] = arr[si];
								arr[si] = temp;
							}
						}
					}
					fsort.errorsuppress = true;
					temp = fsort.quickSort(arr.slice(0,si),carr.slice(0,si));
					arr.splice(0,si,...temp[0]);
					carr.splice(0,si,...temp[1]);
					fsort.errorsuppress = true;
					temp = fsort.quickSort(arr.slice(si+1),carr.slice(si+1));
					arr.splice(si+1,temp[0].length,...temp[0]);
					carr.splice(si+1,temp[1].length,...temp[1]);
					fsort.errorsuppress = oesval;
					return [arr,carr];
				}else if(arr.length === 3){
					return fsort.tsort(arr,carr);
				}else if(arr.length === 2){
					!fsort.errorsuppress && console.warn("fsort.quickSort : Attempting to sort a length 2 array.");
					return (arr[0] > arr[1] ? [arr.toReversed(),carr.toReversed()] : [arr,carr]);
				}else{
					!fsort.errorsuppress && console.warn("fsort.quickSort : Array length is 0 or 1 no sort needed."); //throw new RangeError();
					return [arr,carr];
				}
			}
			static tsort(arr,carr=null){
				const indices = new Uint8Array(3);
				if(arr[1] < arr[0]){
						if(arr[2] < arr[0]){
								if(arr[2] < arr[1]){
										indices[0] = 2;
										indices[1] = 1;
								}else{
										indices[0] = 1;
										indices[1] = 2;
								}
						}else{
								indices[0] = 1;
								indices[2] = 2;
						}
				}else if(arr[2] < arr[0]){
						indices[0] = 2;
						indices[2] = 1;
				}else if(arr[2] < arr[1]){
					indices[1] = 2;
					indices[2] = 1;
				}else{
					indices[1] = 1;
					indices[2] = 2;
				}
				return [[arr[indices[0]],arr[indices[1]],arr[indices[2]]],(carr ? [carr[indices[0]],carr[indices[1]],carr[indices[2]]] : indices)];
			}
		}
		fsort.errorsuppress = true;

		const terryTabs = document.getElementsByClassName("terry-tab");
		for(terryTab of terryTabs){
			const tabForm = terryTab.getElementsByClassName("terry-tab_form")[0];
			const tabContainer = terryTab.getElementsByClassName("terry-tab_container")[0];
			tabForm.addEventListener("change",e=>{
				const selectedTab = parseInt(e.target.value);
				for(let i=0;i<tabContainer.children.length;i++){
					console.log(tabContainer.children[i]);
					if(i===selectedTab){
						tabContainer.children[i].classList.remove('hidden');
					}else{
						tabContainer.children[i].classList.add('hidden');
					}
				}
			});
		}
		class terrySystem {
			constructor(container){
				this.container = container;
			}
			clear(){
				while(this.container.lastChild){this.container.removeChild(this.container.lastChild)}
			}
			display(value,name="Unnamed"){
				const displayCont = document.createElement("div");
				const displayValue = document.createElement("h1");
				displayCont.appendChild(document.createTextNode(name));
				displayValue.innerText = value;
				displayCont.appendChild(displayValue);
				this.container.appendChild(displayCont);
			}
		}
		const terry = new terrySystem(document.getElementById("terry-display"));
		const terryForms = document.getElementsByClassName("terry-form");
		
		terryForms[0].addEventListener("submit",e=>{
			e.preventDefault();
			console.log(e);
			const fields = new FormData(e.target);
			terry.clear();
			let array,carray;
			for(const [key, value] of fields.entries()){
				switch(key){
					case 'array':
						array=value.split(',').map(i=>parseInt(i));
						break;
					case 'carray':
						carray=value.split(',');
						break;
				}
			}
			[array,carray]=fsort.quickSort(array,carray.length === 1 ? null : carray);
			terry.display(array.join(','), "Sort Array");
			terry.display(carray.join(','), "Value Array");
		});
	</script>
</body>
</html>
